name: ci

# Per-commit gate (P1 WS-E). Builds libdeal (Zig) so the FFI links, then runs
# the Rust workspace under fmt/clippy/test, plus the vscode-deal extension's
# pure-Node suites. This is the guardrail that keeps the kind of drift P1 just
# fixed (calc_def half-wiring, behavioral surface untokenized) from silently
# returning between releases — release.yml only runs tests on v*.*.* tags.
#
# The vscode-deal extension lives in its own repository and is gated by its
# own ci.yml (rust + zig are not needed there); this workflow covers the deal
# repo (Zig core + Rust workspace) only.

on:
  push:
  pull_request:

jobs:
  rust:
    name: build + test (rust workspace)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2 # TODO T-3-07: pin commit SHA before production enable
        with:
          version: 0.16.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # TODO T-3-07: pin commit SHA before production enable
        with:
          components: clippy, rustfmt

      # `deal fmt` enforces the FS-3 provenance gate, which fails closed when
      # `git config user.name` is unset (WR-07). A fresh runner has no identity,
      # so cli/tests/fmt_subcommand.rs exits 2 on every case. Give the runner an
      # identity rather than weakening the gate.
      - name: Configure git identity (FS-3 gate)
        run: |
          git config --global user.name "deal CI"
          git config --global user.email "ci@deal-lang.invalid"

      - name: Build libdeal.a (host)
        run: zig build -Doptimize=ReleaseSafe

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # cli/tests/phase5_e2e.rs copies spec/examples/showcase into a temp dir and
      # simulates it. That copy includes the vendored stdlib at
      # .deal/deps/deal-stdlib, without which every `import deal.std.units.{…}`
      # is unresolvable and simulate refuses to run. `.deal/` is gitignored, so
      # a fresh checkout has no stdlib and it must be vendored here — exactly as
      # spec/examples/showcase/deal.toml documents. The dep is SHA-pinned by
      # spec/examples/showcase/deal.lock, so this stays reproducible.
      - name: Vendor showcase dependencies (deal install)
        run: |
          cargo build -p deal
          cd spec/examples/showcase
          "$GITHUB_WORKSPACE/target/debug/deal" install

      - name: cargo test
        run: cargo test --workspace
